name: Validate site

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reject committed inbox HTML
        run: |
          if git ls-files 'inbox/**/*.html' | grep .; then
            echo "Raw Evernote HTML exports must not be committed under inbox/."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest
